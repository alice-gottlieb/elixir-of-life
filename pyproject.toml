[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elixir-query"
version = "0.1.0"
description = "Unified Python access to ELIXIR Core Data Resources. Call elixir_query.get(<db>, ...) and receive a Polars DataFrame."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "elixir-of-life contributors" }]
keywords = ["elixir", "bioinformatics", "uniprot", "ensembl", "chembl", "polars"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "polars>=0.20",
    "httpx>=0.27",
    "tenacity>=8.2",
    "pyarrow>=14",
    "platformdirs>=4",
    "keyring>=24",
    "tqdm>=4.66",
    "rapidfuzz>=3",
    "tomli>=2; python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "pytest-timeout>=2.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/alice-gottlieb/elixir-of-life"
Issues = "https://github.com/alice-gottlieb/elixir-of-life/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/elixir_query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: hits real upstream ELIXIR endpoints over the network",
    "bulk: downloads a full bulk dump; slow; opt-in via --run-bulk",
]
timeout = 60

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
